<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8ad6"/>
      <stop offset="1" stop-color="#0f6cbd"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <!-- Fluent-blue rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <!-- subtle top sheen (Office-glass feel, clipped so corners stay round) -->
  <rect x="8" y="8" width="240" height="122" fill="#ffffff" opacity="0.07" clip-path="url(#tileClip)"/>

  <!-- microphone: capsule + U-bracket + stem -->
  <g>
    <rect x="74" y="66" width="46" height="86" rx="23" fill="#ffffff"/>
    <path d="M 55 128 A 42 42 0 0 0 139 128" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="97" y1="170" x2="97" y2="188" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- soundwave bars -->
  <g fill="#ffffff">
    <rect x="160" y="106" width="13" height="46" rx="6.5"/>
    <rect x="182" y="84"  width="13" height="90" rx="6.5"/>
    <rect x="204" y="116" width="13" height="42" rx="6.5"/>
  </g>
</svg>
